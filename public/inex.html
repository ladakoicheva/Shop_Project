<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="cont">
    <div class="elem"></div>
    <div class="elem"></div>
    <div class="elem"></div>
    <div class="elem"></div>
  </div>
  <style>
    .cont {
      width: 500px;
      height: 500px;
      position: relative;

      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
    }
    .elem:nth-child(1) {
      width: 50px;
      height: 50px;
      background-color: red;
    }
    .elem:nth-child(2) {
      width: 50px;
      height: 50px;
      background-color: pink;
      position: absolute;
      right: 100px;
      bottom: 100px;
    }
    .elem:nth-child(3) {
      width: 50px;
      height: 50px;
      background-color: yellow;
    }
    .elem:nth-child(4) {
      width: 50px;
      height: 50px;
      background-color: orange;
    }
  </style>
</body>
</html>
